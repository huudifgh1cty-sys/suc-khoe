<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gan Khỏe - Nhật ký sức khỏe</title>

  <!-- Cấu hình Icon cho màn hình chính (Tránh bị chữ G) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon.png">

  <!-- Thư viện Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .logged-out { background-color: #f8d7da; color: #721c24; }
    .logged-in { background-color: #d4edda; color: #155724; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
    .btn-login { background-color: #4285f4; color: white; }
    .btn-logout { background-color: #dc3545; color: white; margin-left: 10px; }
  </style>
</head>
<body>

  <h2>Nhật ký sức khỏe GAN KHỎE</h2>

  <!-- Hiển thị trạng thái kết nối -->
  <div id="statusBox" class="status-bar logged-out">
    <span id="statusText">Chưa kết nối Drive (Đã lưu local)</span>
  </div>

  <!-- Nút bấm điều khiển -->
  <div style="text-align: center;">
    <button id="btnLogin" class="btn-login" onclick="loginGoogle()">Đăng nhập Google</button>
    <button id="btnLogout" class="btn-logout" onclick="logoutGoogle()" style="display: none;">Đăng xuất</button>
  </div>

  <script>
    // === ĐÃ THAY CLIENT ID CỦA BẠN VÀO ĐÂY ===
    const CLIENT_ID = '365249760461-ok13ql9ae57rttl0dkgn8b1ta653fgl7.apps.googleusercontent.com';
    const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

    let tokenClient;

    window.onload = () => {
      // Khởi tạo Google Token Client
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (response) => {
          if (response.access_token) {
            saveSession(response.access_token, response.expires_in);
            updateUI(true);
          }
        },
      });

      // Tự động kiểm tra và khôi phục phiên đăng nhập khi load trang
      checkAutoLogin();
    };

    // Hàm gọi popup đăng nhập
    function loginGoogle() {
      tokenClient.requestAccessToken({ prompt: '' });
    }

    // Hàm đăng xuất
    function logoutGoogle() {
      localStorage.removeItem('drive_access_token');
      localStorage.removeItem('drive_token_expires');
      updateUI(false);
    }

    // Lưu phiên đăng nhập vào bộ nhớ trình duyệt (localStorage)
    function saveSession(token, expiresInSeconds) {
      const expiresAt = Date.now() + (expiresInSeconds * 1000);
      localStorage.setItem('drive_access_token', token);
      localStorage.setItem('drive_token_expires', expiresAt);
    }

    // Kiểm tra tự động đăng nhập khi mở app
    function checkAutoLogin() {
      const token = localStorage.getItem('drive_access_token');
      const expiresAt = localStorage.getItem('drive_token_expires');

      if (token && expiresAt && Date.now() < parseInt(expiresAt)) {
        // Phiên làm việc còn hạn -> Giữ trạng thái đã đăng nhập
        updateUI(true);
      } else if (token) {
        // Token hết hạn -> Xin lại token ngầm
        loginGoogle();
      } else {
        updateUI(false);
      }
    }

    // Cập nhật giao diện ứng dụng
    function updateUI(isLoggedIn) {
      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      const btnLogin = document.getElementById('btnLogin');
      const btnLogout = document.getElementById('btnLogout');

      if (isLoggedIn) {
        statusBox.className = 'status-bar logged-in';
        statusText.innerText = 'Đã kết nối Google Drive';
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
      } else {
        statusBox.className = 'status-bar logged-out';
        statusText.innerText = 'Chưa kết nối Drive (Đã lưu local)';
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
      }
    }
  </script>
</body>
</html>
